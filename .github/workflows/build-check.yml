name: Build check
on:
  pull_request:
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Old URLs still resolve
        run: |
          set -o pipefail
          node .github/scripts/verify-urls.mjs 2>&1 | tee -a build.log
      - name: Post the error to the pull request
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Build failed'; echo '```'; grep -v '^warning:' build.log | tail -n 80; echo '```'; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file comment.md
      - name: Screenshots
        if: success()
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          (npx astro preview --port 4321 &) && sleep 4
          node .github/scripts/screenshots.mjs
          cp build.log shots/
      - name: Lighthouse (mobile)
        if: success()
        run: |
          npm install -g @lhci/cli@0.14.0
          lhci collect --staticDistDir=./dist --numberOfRuns=3 \
            --url=http://localhost/ --url=http://localhost/services/website-support/ \
            --url=http://localhost/blog/who-owns-my-website/ --url=http://localhost/portfolio/jaynes-bridalwear-lincoln/ \
            --url=http://localhost/web-designer-york/ --url=http://localhost/blog/ || true
          node .github/scripts/lh-summary.mjs || true
      - name: Publish screenshots to the ci-screenshots branch
        if: success()
        run: |
          cd shots
          git init -q && git checkout -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Screenshots for ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
