[build]
  publish = "dist"
  command = "npm run build"

  [build.environment]
    NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Astro writes every generated image and asset here with a content hash.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
